name: CI

# Tests and clippy on every push and pull request. The cloud release calls this as its gate.

on:
  push:
    branches: [main]
    paths-ignore: ["AGENTS.md", "README.md", "docs/**"]
  pull_request:
    paths-ignore: ["AGENTS.md", "README.md", "docs/**"]
  workflow_call:
    inputs:
      folder:
        description: Target folder name on the Windows runner
        type: string
        default: gate

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests and clippy
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Host runners (macOS, Windows) start every job in a fresh,
      # randomly named work folder, so rust-cache never matched
      # there: its cache version hashes the absolute target path
      # ("No cache found", full rebuilds every run). target/ points
      # at a fixed folder on the runner instead and builds reuse the
      # previous run directly. Cargo's lock covers only the build:
      # a push run executing its test exes while the release gate
      # relinks them fails both with LNK1104 (0.2.87, runs 286-289).
      # So the release gate (workflow_call) builds in its own folder.
      # Owner-approved 2026-11-10 (same fix as BlindRSS-Rust df47812).
      # CARGO_TARGET_DIR is the folder's real path: CMake caches
      # absolute paths, and the path through the link changes
      # with every work folder ("CMakeCache.txt directory ... is
      # different"). The link keeps target/... references working.
      # ponytail: the folder only grows; delete it on the runner
      # when disk gets tight (next build is cold once).
      - name: Persistent target folder (Windows host runner)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FOLDER: ${{ inputs.folder || 'test' }}
        run: |
          $dir = "C:/forgejo-runner/cargo-target/blindradio/$env:FOLDER"
          New-Item -ItemType Directory -Force $dir | Out-Null
          if (Test-Path target) { cmd /c rmdir /s /q target }
          New-Item -ItemType Junction -Path target -Target $dir | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$dir"

      - name: Test
        run: cargo test --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Drop only the link, never the shared folder behind it,
      # before the runner deletes the work folder.
      # Each commit leaves new copies of the workspace crates' test
      # exes and libraries (~1 GB a release); nothing reuses the old
      # ones, since every release bumps the shared version. Drop those
      # left by earlier runs. Dependencies and the wxWidgets CMake
      # build stay: rebuilding them is what makes a cold build slow.
      # ponytail: old dependency copies after `cargo update` still pile
      # up slowly; delete the folder on the runner if that ever matters.
      - name: Prune old workspace builds (free disk)
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $old = (Get-Date).AddHours(-2)
          Get-ChildItem "$env:CARGO_TARGET_DIR/*/build/blindradio*", "$env:CARGO_TARGET_DIR/*/build/xtask" -Directory -ErrorAction SilentlyContinue |
            Get-ChildItem -Directory | Where-Object LastWriteTime -lt $old | Remove-Item -Recurse -Force
      - name: Unlink persistent target folder (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path target) { (Get-Item target).Delete() }
