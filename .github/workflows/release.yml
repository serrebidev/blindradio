name: Release (cloud)

# The cloud release path: the same gates and assets as `cargo xtask release`
# on Brandon's PC, run entirely in Actions. Dispatch it with a version whose
# `## <version>` section is already in CHANGELOG.md. Use one path per
# release — never run this and a local xtask release for the same version.
# The Windows leg is Authenticode-unsigned here (the owner's certificate
# stays on his PC); every asset still carries its minisign signature.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 0.2.7"
        required: true
        type: string

concurrency:
  group: cloud-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Tests and clippy
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets

  prepare:
    name: Bump, tag and draft
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.make.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Extract the notes and bump the version
        id: make
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git ls-remote --tags origin "$tag" | grep -q .; then
            # A tag left by an earlier dispatch of this same workflow, with
            # its release still a draft, means a later leg failed: resume
            # that release instead of starting over. A published release
            # under the tag stays refused — never re-release.
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)" = "true" ]; then
              echo "Resuming $tag: tag and unpublished draft already exist."
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "tag $tag already exists; refusing to re-release" >&2
            exit 1
          fi
          python3 - "$VERSION" <<'PY'
          import sys
          version = sys.argv[1]
          head = f"## {version}"
          notes, inside = [], False
          for line in open("CHANGELOG.md").read().splitlines():
              if line.startswith("## "):
                  inside = line.strip() == head
                  if inside:
                      continue
                  if notes:
                      break
              if inside:
                  notes.append(line)
          notes = "\n".join(notes).strip()
          if not notes:
              sys.exit(f"no {head} section in CHANGELOG.md")
          import os
          with open(os.path.join(os.environ["RUNNER_TEMP"], "notes.md"), "w") as f:
              f.write(notes + "\n")
          lines = open("Cargo.toml").read().splitlines(keepends=True)
          for i, line in enumerate(lines):
              if line.startswith('version = "'):
                  lines[i] = f'version = "{version}"\n'
                  break
          else:
              sys.exit("no version line in the workspace manifest")
          open("Cargo.toml", "w").write("".join(lines))
          PY
          cargo metadata --format-version 1 > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release $VERSION"
          git tag "$tag"
          git push origin main "$tag"
          gh release create "$tag" --draft --title "BlindRadio $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows assets
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Find the VC++ runtime redist
        shell: pwsh
        run: |
          $need = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")
          function Test-CrtDir($dir) {
            if (-not $dir) { return $false }
            foreach ($dll in $need) { if (-not (Test-Path (Join-Path $dir $dll))) { return $false } }
            return $true
          }
          $dir = $null
          # Route 1: the newest VS install's redist tree, any version year.
          $roots = @()
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $roots += & $vswhere -latest -products * -property installationPath
          }
          foreach ($base in @("C:\Program Files\Microsoft Visual Studio", "C:\Program Files (x86)\Microsoft Visual Studio")) {
            if (Test-Path $base) { $roots += Get-ChildItem $base -Directory | ForEach-Object { Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue } | ForEach-Object { $_.FullName } }
          }
          foreach ($root in ($roots | Select-Object -Unique)) {
            $redist = Join-Path $root "VC\Redist\MSVC"
            if (-not (Test-Path $redist)) { continue }
            $hit = Get-ChildItem $redist -Recurse -Filter "msvcp140.dll" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "x64" } | Sort-Object FullName | Select-Object -Last 1
            if ($hit -and (Test-CrtDir $hit.DirectoryName)) { $dir = $hit.DirectoryName; break }
          }
          # Route 2: the installed redistributable in System32.
          if (-not $dir -and (Test-CrtDir "C:\Windows\System32")) { $dir = "C:\Windows\System32" }
          if (-not $dir) { throw "VC++ runtime redist not found on this runner" }
          Write-Host "VC_REDIST_DIR=$dir"
          "VC_REDIST_DIR=$dir" >> $env:GITHUB_ENV

      - name: Make sure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and
              -not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }

      - name: Build the Windows assets
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          BLINDRADIO_UNSIGNED: "1"
        run: cargo xtask dist-windows

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ needs.prepare.outputs.tag }}"
          target/dist/BlindRadio.zip target/dist/BlindRadio.zip.minisig
          target/dist/BlindRadio_setup.exe target/dist/BlindRadio_setup.exe.minisig
          --clobber

  linux:
    name: Linux assets
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Build in the repo's container and sign
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          set -euo pipefail
          docker build -t blindradio-build tools/linux
          docker run --rm -v "$PWD:/work" -v "$PWD/target:/work/target" \
            -e MINISIGN_KEY blindradio-build sh -c \
            'cargo build --release -p blindradio && cargo xtask dist-linux && cargo xtask sign target/dist/BlindRadio.AppImage target/dist/BlindRadio.tar.gz'

      - name: Check the AppImage starts
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libegl1 libgl1 > /dev/null
          timeout 15 xvfb-run -a ./target/dist/BlindRadio.AppImage
          code=$?
          if [ $code -ne 124 ]; then
            timeout 15 xvfb-run -a ./target/dist/BlindRadio.AppImage --appimage-extract-and-run
            code=$?
          fi
          if [ $code -ne 124 ]; then
            echo "AppImage exited with $code instead of still running" >&2
            exit 1
          fi

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ needs.prepare.outputs.tag }}"
          target/dist/BlindRadio.AppImage target/dist/BlindRadio.AppImage.minisig
          target/dist/BlindRadio.tar.gz target/dist/BlindRadio.tar.gz.minisig
          --clobber

  macos:
    name: macOS asset
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Apple Silicon only
        run: test "$(uname -m)" = arm64

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Toolchain the wxDragon build needs
        run: brew install cmake ninja llvm

      - name: Build the app and the disk image
        env:
          LIBCLANG_PATH: /opt/homebrew/opt/llvm/lib
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: cargo xtask dist-macos

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ needs.prepare.outputs.tag }}"
          target/dist/BlindRadio.dmg target/dist/BlindRadio.dmg.minisig
          --clobber

  publish:
    name: Verify and publish
    needs: [prepare, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      # gh resolves the repo from the checkout's remote here; without one
      # `release edit` dies on "not a git repository". GH_REPO pins it too.
      - uses: actions/checkout@v5
      - name: Every asset and signature present, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          present="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          echo "$present"
          for name in BlindRadio.zip BlindRadio_setup.exe BlindRadio.AppImage BlindRadio.tar.gz BlindRadio.dmg; do
            for wanted in "$name" "$name.minisig"; do
              grep -qx "$wanted" <<<"$present" || { echo "missing: $wanted"; exit 1; }
            done
          done
          gh release edit "$tag" --draft=false --latest
