name: Release (Forgejo)

# The one release path. Dispatch it with a version whose `## <version>` section is already
# in CHANGELOG.md. The Windows leg is Authenticode-unsigned (no certificate here); every
# asset carries its minisign signature.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 0.2.7"
        required: true
        type: string

concurrency:
  group: cloud-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The gate and the builds run at the same time; publish needs both. A failed gate
  # publishes nothing: the tag and the release are made only at the end.
  gate:
    uses: ./.github/workflows/ci.yml

  bump:
    name: Bump the version
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.make.outputs.branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.FORGEJO_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Bump onto a release branch
        id: make
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git ls-remote --tags origin "$tag" | grep -q .; then
            echo "tag $tag already exists; refusing to re-release" >&2
            exit 1
          fi
          python3 - "$VERSION" <<'PY'
          import re, sys
          version = sys.argv[1]
          if not any(l.strip() == f"## {version}" for l in open("CHANGELOG.md").read().splitlines()):
              sys.exit(f"no ## {version} section in CHANGELOG.md")
          lines = open("Cargo.toml").read().splitlines(keepends=True)
          for i, line in enumerate(lines):
              if line.startswith('version = "'):
                  lines[i] = f'version = "{version}"\n'
                  break
          else:
              sys.exit("no version line in the workspace manifest")
          open("Cargo.toml", "w").write("".join(lines))
          # The lock's copy of our own version moves with the manifest. Left to cargo, the
          # change makes it resolve our `*` dependencies again and settle on older versions
          # the lock already holds, so what ships is not what the gate tested.
          blocks = open("Cargo.lock").read().split("[[package]]\n")
          for i, block in enumerate(blocks):
              # Only workspace members have no source line.
              if i and "\nsource = " not in block:
                  blocks[i] = re.sub(r'^version = ".*"$', f'version = "{version}"', block, count=1, flags=re.M)
          open("Cargo.lock", "w").write("[[package]]\n".join(blocks))
          PY
          # Fails if the lock would still change.
          cargo metadata --locked --format-version 1 > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          # [skip ci]: the gate already tests this, a push-triggered CI would only queue.
          git diff --cached --quiet || git commit -m "chore: release $VERSION [skip ci]"
          branch="release/$tag"
          # A rerun after a failure starts this branch over.
          git push -f origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows assets
    needs: bump
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.branch }}

      - uses: dtolnay/rust-toolchain@stable

      # Host runners (macOS, Windows) start every job in a fresh,
      # randomly named work folder, so rust-cache never matched
      # there: its cache version hashes the absolute target path
      # ("No cache found", full rebuilds every run). target/ points
      # at a fixed folder on the runner instead and builds reuse the
      # previous run directly. Two jobs on one folder take turns:
      # cargo locks its target folder.
      # Owner-approved 2026-11-10 (same fix as BlindRSS-Rust df47812).
      # CARGO_TARGET_DIR is the folder's real path: CMake caches
      # absolute paths, and the path through the link changes
      # with every work folder ("CMakeCache.txt directory ... is
      # different"). The link keeps target/... references working.
      # ponytail: the folder only grows; delete it on the runner
      # when disk gets tight (next build is cold once).
      - name: Persistent target folder (Windows host runner)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = 'C:/forgejo-runner/cargo-target/blindradio/windows'
          New-Item -ItemType Directory -Force $dir | Out-Null
          if (Test-Path target) { cmd /c rmdir /s /q target }
          New-Item -ItemType Junction -Path target -Target $dir | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$dir"

      - name: Find the VC++ runtime redist
        shell: pwsh
        run: |
          $need = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")
          function Test-CrtDir($dir) {
            if (-not $dir) { return $false }
            foreach ($dll in $need) { if (-not (Test-Path (Join-Path $dir $dll))) { return $false } }
            return $true
          }
          $dir = $null
          # Route 1: the newest VS install's redist tree, any version year.
          $roots = @()
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $roots += & $vswhere -latest -products * -property installationPath
          }
          foreach ($base in @("C:\Program Files\Microsoft Visual Studio", "C:\Program Files (x86)\Microsoft Visual Studio")) {
            if (Test-Path $base) { $roots += Get-ChildItem $base -Directory | ForEach-Object { Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue } | ForEach-Object { $_.FullName } }
          }
          foreach ($root in ($roots | Select-Object -Unique)) {
            $redist = Join-Path $root "VC\Redist\MSVC"
            if (-not (Test-Path $redist)) { continue }
            $hit = Get-ChildItem $redist -Recurse -Filter "msvcp140.dll" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "x64" } | Sort-Object FullName | Select-Object -Last 1
            if ($hit -and (Test-CrtDir $hit.DirectoryName)) { $dir = $hit.DirectoryName; break }
          }
          # Route 2: the installed redistributable in System32.
          if (-not $dir -and (Test-CrtDir "C:\Windows\System32")) { $dir = "C:\Windows\System32" }
          if (-not $dir) { throw "VC++ runtime redist not found on this runner" }
          Write-Host "VC_REDIST_DIR=$dir"
          "VC_REDIST_DIR=$dir" >> $env:GITHUB_ENV

      - name: Make sure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and
              -not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }

      - name: Build the Windows assets
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          BLINDRADIO_UNSIGNED: "1"
        run: cargo xtask dist-windows

      - name: Upload signed packages
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: BlindRadio-windows
          path: |
            target/dist/BlindRadio.zip
            target/dist/BlindRadio.zip.minisig
            target/dist/BlindRadio_setup.exe
            target/dist/BlindRadio_setup.exe.minisig

      # Drop only the link, never the shared folder behind it,
      # before the runner deletes the work folder.
      - name: Unlink persistent target folder (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path target) { (Get-Item target).Delete() }


  linux:
    name: Linux assets
    needs: bump
    # WSL on the Windows build PC (runner wsl-linux-x64), Ubuntu 24.04 job container:
    # the owner's rule is Linux builds in WSL. Runs alongside the Windows and macOS legs.
    runs-on: wsl-linux
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.branch }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang libclang-dev \
            libgtk-3-dev libasound2-dev libssl-dev pkg-config \
            curl ca-certificates file xvfb fuse libfuse2 xauth libegl1 libgl1

      - name: Build in the runner's Ubuntu container and sign
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          cargo build --locked --release -p blindradio
          cargo xtask dist-linux
          cargo xtask sign target/dist/BlindRadio.AppImage target/dist/BlindRadio.tar.gz

      - name: Check the AppImage starts
        run: |
          set +e
          timeout 15 xvfb-run -a ./target/dist/BlindRadio.AppImage
          code=$?
          if [ $code -ne 124 ]; then
            timeout 15 xvfb-run -a ./target/dist/BlindRadio.AppImage --appimage-extract-and-run
            code=$?
          fi
          if [ $code -ne 124 ]; then
            echo "AppImage exited with $code instead of still running" >&2
            exit 1
          fi

      - name: Upload signed packages
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: BlindRadio-linux
          path: |
            target/dist/BlindRadio.AppImage
            target/dist/BlindRadio.AppImage.minisig
            target/dist/BlindRadio.tar.gz
            target/dist/BlindRadio.tar.gz.minisig


  macos:
    name: macOS asset
    needs: bump
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Apple Silicon only
        run: test "$(uname -m)" = arm64

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.branch }}

      - uses: dtolnay/rust-toolchain@stable

      # Host runners (macOS, Windows) start every job in a fresh,
      # randomly named work folder, so rust-cache never matched
      # there: its cache version hashes the absolute target path
      # ("No cache found", full rebuilds every run). target/ points
      # at a fixed folder on the runner instead and builds reuse the
      # previous run directly. Two jobs on one folder take turns:
      # cargo locks its target folder.
      # CARGO_TARGET_DIR is the folder's real path: CMake caches
      # absolute paths, and the path through the link changes
      # with every work folder ("CMakeCache.txt directory ... is
      # different"). The link keeps target/... references working.
      # Owner-approved 2026-11-10 (same fix as BlindRSS-Rust df47812).
      # ponytail: the folder only grows; delete it on the runner
      # when disk gets tight (next build is cold once).
      - name: Persistent target folder (macOS host runner)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dir="$HOME/forgejo-runner/cargo-target/blindradio/macos"
          mkdir -p "$dir"
          rm -rf target
          ln -s "$dir" target
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      - name: Toolchain the wxDragon build needs
        run: brew install cmake ninja llvm

      - name: Build the app and the disk image
        env:
          LIBCLANG_PATH: /opt/homebrew/opt/llvm/lib
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: cargo xtask dist-macos

      - name: Upload signed packages
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: BlindRadio-macos
          path: |
            target/dist/BlindRadio.dmg
            target/dist/BlindRadio.dmg.minisig

      # Drop only the link, never the shared folder behind it,
      # before the runner deletes the work folder.
      - name: Unlink persistent target folder (macOS)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f target


  publish:
    name: Verify and publish
    needs: [gate, bump, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      # Collect every platform's signed packages before publishing the release.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.FORGEJO_TOKEN }}
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Every asset and signature present, then tag and publish
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ needs.bump.outputs.branch }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          names="BlindRadio.zip BlindRadio_setup.exe BlindRadio.AppImage BlindRadio.tar.gz BlindRadio.dmg"
          for wanted in $names; do
            test -f "artifacts/$wanted"
            test -f "artifacts/$wanted.minisig"
          done
          python3 - "$VERSION" <<'PY'
          import os, sys
          head = f"## {sys.argv[1]}"
          notes, inside = [], False
          for line in open("CHANGELOG.md").read().splitlines():
              if line.startswith("## "):
                  inside = line.strip() == head
                  if inside:
                      continue
                  if notes:
                      break
              if inside:
                  notes.append(line)
          notes = "\n".join(notes).strip()
          if not notes:
              sys.exit(f"no {head} section in CHANGELOG.md")
          open(os.path.join(os.environ["RUNNER_TEMP"], "notes.md"), "w").write(notes + "\n")
          PY
          git tag "$tag"
          git push origin "$tag"
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          h="Authorization: token $FORGEJO_TOKEN"
          # Draft first, so the release never shows without its files.
          id="$(jq -n --arg tag "$tag" --arg name "BlindRadio $VERSION" --rawfile body "$RUNNER_TEMP/notes.md"             '{tag_name: $tag, name: $name, body: $body, draft: true}' |
            curl -sf -H "$h" -H 'Content-Type: application/json' -d @- "$api/releases" | jq -r .id)"
          for file in artifacts/*; do
            name="$(basename "$file")"
            curl -sf -o /dev/null -H "$h" -F "attachment=@$file" "$api/releases/$id/assets?name=$name"
          done
          present="$(curl -sf -H "$h" "$api/releases/$id" | jq -r '.assets[].name')"
          echo "$present"
          for name in $names; do
            for wanted in "$name" "$name.minisig"; do
              grep -qx "$wanted" <<<"$present" || { echo "missing: $wanted"; exit 1; }
            done
          done
          curl -sf -o /dev/null -X PATCH -H "$h" -H 'Content-Type: application/json'             -d '{"draft": false, "prerelease": false}' "$api/releases/$id"
          test "$(curl -sf "$api/releases/latest" | jq -r .tag_name)" = "$tag"
          # Main takes the bump. Pushes during the run: merge them in.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git push origin HEAD:main; then
            git fetch origin main
            git merge --no-edit -m "Merge release $VERSION [skip ci]" origin/main
            git push origin HEAD:main
          fi
          git push origin --delete "$BRANCH"
