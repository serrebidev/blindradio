[package]
name = "blindradio"
edition.workspace = true
license.workspace = true
version.workspace = true

# Translations via patois: this crate's strings are extracted to po/blindradio.pot.
[package.metadata.patois]
translatable = true

[dependencies]
blindradio-core = { path = "../blindradio-core" }
# crates.io (AllenDang upstream): trypsynth/wxDragon main is behind it (0.9.21, wxWidgets 3.3.3) and wx-utils needs 0.9.22+.
# default-features = false for exactly one reason: wxdragon's
# defaults include wx-asserts, which builds wxWidgets with
# its internal consistency checks live — every failed check
# becomes a modal "debugging check" dialog for the end user,
# even in release builds (the class removed in
# Accessible-IPTV-Client-Rust v0.4.19). Release wx builds
# compile those checks out, as wxPython ships. Every other
# default is re-enabled explicitly, so the ONLY build change
# is the asserts.
wxdragon = { version = "*", default-features = false, features = ["wx-printing", "wx-tiff", "wx-jpeg", "wx-tango-icons", "wx-extra-image-formats", "wx-regex", "appindicator"] }
# Git main needs an unreleased wxDragon Event API; use the latest published pair.
wx-utils = { version = "*", features = ["shortcuts", "global-hotkeys"] }
crossbeam-channel = "*"
parking_lot = "*"
tokio = { version = "*", features = ["rt"] }
serde_json = "*"
live-region = { git = "https://github.com/trypsynth/live-region", version = "0.3.3" }
flate2 = "*"
ship-shape = "0.5.0"
# Translations (gettext via patois). Pinned to the 0.3 line like ship-shape:
# its API changed across minors (0.3 dropped the t! macros).
patois = { version = "0.3", features = ["wx"] }

[target.'cfg(not(windows))'.dependencies]
# Global hotkeys on macOS and X11; Windows uses wx-utils.
global-hotkey = "*"

[target.'cfg(windows)'.dependencies]
# Loads NVDA's controller client DLL at runtime (speech.rs); the DLL
# itself ships beside the exe, nothing is linked.
libloading = "*"
# JAWS speech (jaws.rs), over its COM object.
windows = { version = "*", features = [
	"Win32_System_Com",
	"Win32_System_Ole",
	"Win32_System_Power",
	"Win32_System_Threading",
	"Win32_System_Variant",
	"Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest = "*"
shipfitter = { version = "0.2.4", features = ["docs", "package", "windows-resources"] }
patois-build = "0.1"

[dev-dependencies]
tokio = { version = "*", features = ["rt-multi-thread", "time"] }
uiautomation = "0.25.1"
patois-build = "0.1"
