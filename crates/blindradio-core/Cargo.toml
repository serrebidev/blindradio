[package]
name = "blindradio-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
thiserror = "*"
reqwest = { version = "*", default-features = false, features = ["rustls", "stream", "form", "multipart", "json", "gzip"] }
tokio = { version = "*", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "process"] }
sha2 = "*"
zip = { version = "*", default-features = false, features = ["deflate"] }
serde_json = "*"
percent-encoding = "*"
unicode-normalization = "*"
uuid = { version = "*", features = ["v4"] }
bytes = "*"
crossbeam-channel = "*"
rubato = "*"
symphonia = { version = "*", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "vorbis"] }
symphonia-adapter-fdk-aac = "*"
symphonia-adapter-libopus = "*"
oxideav-mp2 = "*"
parking_lot = "*"
serde = { version = "*", features = ["derive"] }
quick-xml = { version = "*", features = ["serialize"] }
scraper = "*"
base64 = "*"
flate2 = "*"
m3u8-rs = "*"
cpal = "*"
dirs = "*"
hound = "*"
mp3lame-encoder = "*"
flacenc = "*"
md5 = "*"
aes = "*"
oxideav-ac3 = "*"
oxideav-core = "*"

[dev-dependencies]
tempfile = "*"
