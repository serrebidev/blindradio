[package]
name = "blindradio-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
thiserror = "*"
reqwest = { version = "*", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "*", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
serde_json = "*"
bytes = "*"
crossbeam-channel = "*"
rubato = "*"
symphonia = { version = "*", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "vorbis"] }
symphonia-adapter-fdk-aac = "*"
symphonia-adapter-libopus = "*"
parking_lot = "*"
serde = { version = "*", features = ["derive"] }

[dev-dependencies]
tokio = { version = "*", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tempfile = "*"
