[package]
name = "blindradio-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
thiserror = "*"
reqwest = { version = "*", default-features = false, features = ["rustls", "stream", "form"] }
tokio = { version = "*", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
serde_json = "*"
percent-encoding = "*"
uuid = { version = "*", features = ["v4"] }
bytes = "*"
crossbeam-channel = "*"
rubato = "*"
symphonia = { version = "*", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "vorbis"] }
symphonia-adapter-fdk-aac = "*"
symphonia-adapter-libopus = "*"
parking_lot = "*"
serde = { version = "*", features = ["derive"] }
quick-xml = { version = "*", features = ["serialize"] }
scraper = "*"
m3u8-rs = "*"
cpal = "*"
dirs = "*"

[dev-dependencies]
tempfile = "*"
