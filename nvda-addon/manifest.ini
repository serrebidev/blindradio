name = BlindRadio
summary = BlindRadio status bar
description = """Makes NVDA+End read BlindRadio's status line. BlindRadio's status bar is a standard wxWidgets status bar, but NVDA's position-based lookup misses it, so NVDA+End says "No status line found". This add-on hands NVDA the status bar object directly. Nothing else changes."""
author = Brandon Bracey
url = https://github.com/serrebidev/BlindRadio
version = 1.0.0
minimumNVDAVersion = 2019.3
lastTestedNVDAVersion = 2026.3
updateChannel = null
